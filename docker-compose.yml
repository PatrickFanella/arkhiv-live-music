# Use --env-file deploy/archive-core.env for the reviewed engine pin.
# The optional core-dev override builds shared-engine changes from Arkhiv.
x-core-environment: &core-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
  VHNESS_COLLECTION: etree
  API_ADDR: 0.0.0.0:8080
  ARKHIV_PUBLIC: "0"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 20

  initialize:
    image: ${ARCHIVE_ENGINE_IMAGE:?Load deploy/archive-core.env}
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        vhness migrate &&
        vhness collection --collection etree --policy ${COLLECTION_POLICY:-source_stream}
        --budget ${MEDIA_BUDGET:-0} --reserve ${MEDIA_RESERVE:-0} &&
        vhness discover-catalog --pages 0 --items 0
    environment: *core-environment
    depends_on:
      postgres: {condition: service_healthy}

  api:
    image: ${ARCHIVE_ENGINE_IMAGE:?Load deploy/archive-core.env}
    environment: *core-environment
    volumes:
      - media-data:/media:ro
      - derivative-data:/derivatives:ro
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      initialize: {condition: service_completed_successfully}

  metadata-worker:
    image: ${ARCHIVE_ENGINE_IMAGE:?Load deploy/archive-core.env}
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        while true; do
        available_kib=$$(df -Pk / | awk 'NR==2 {print $$4}');
        if [ "$$available_kib" -lt 20971520 ]; then
        echo 'Metadata import paused: free space below 20 GiB reserve'; sleep 300; continue; fi;
        vhness discover-catalog --pages 1 --items 100 --delay 1s --timeout 10m; sleep 30; done
    environment: *core-environment
    depends_on:
      initialize: {condition: service_completed_successfully}
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}

  playback-reviewer:
    profiles: [playback]
    image: ${ARCHIVE_ENGINE_IMAGE:?Load deploy/archive-core.env}
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        test -n "$$PLAYBACK_REVIEW_NOTES" || { echo 'Set explicit PLAYBACK_REVIEW_NOTES before starting'; exit 1; };
        while true; do
        vhness review-source-audio-batch --items 100 --timeout 10m --notes "$$PLAYBACK_REVIEW_NOTES";
        sleep 30; done
    environment:
      <<: *core-environment
      PLAYBACK_REVIEW_NOTES: ${PLAYBACK_REVIEW_NOTES:-}
    depends_on:
      initialize: {condition: service_completed_successfully}
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}

  operator:
    profiles: [operator]
    image: ${ARCHIVE_ENGINE_IMAGE:?Load deploy/archive-core.env}
    environment: *core-environment
    volumes:
      - media-data:/media
      - derivative-data:/derivatives
      - ${IMPORT_ROOT:-./data/imports}:/imports:ro
    depends_on:
      initialize: {condition: service_completed_successfully}

  web:
    build: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on: [api]

volumes:
  postgres-data:
  media-data:
  derivative-data:
