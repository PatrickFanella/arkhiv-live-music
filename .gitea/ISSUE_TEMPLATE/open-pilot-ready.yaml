name: Open Pilot task — ready for pickup
about: Submit a reviewed, bounded task and opt into automated pickup
title: ''
labels:
- ready-for-agent
- agent:queued
body:
- type: markdown
  attributes:
    value: 'Submitting this form applies ready-for-agent and agent:queued and opts
      into automated pickup on the next poll. The repository must have an admitted
      executor. Review all fields before submitting.

      '
- type: input
  id: goal
  attributes:
    label: Goal
    description: One concrete outcome Open Pilot should produce.
    placeholder: Add docs/reference/postgres.md with local database setup notes.
  validations:
    required: true
- type: textarea
  id: context
  attributes:
    label: Context
    description: Links, files, existing behavior, constraints, and any product or
      domain background needed.
    placeholder: '- Relevant files: README.md, docs/stacks.md

      - Keep this docs-only; do not add application scaffolding.

      '
  validations:
    required: true
- type: textarea
  id: acceptance-criteria
  attributes:
    label: Acceptance Criteria
    description: Checkable requirements. Keep them specific and observable.
    value: '- [ ] Required file or feature exists.

      - [ ] Existing behavior remains unchanged unless explicitly requested.

      - [ ] Implementation is limited to the scope described above.

      '
  validations:
    required: true
- type: textarea
  id: test-command
  attributes:
    label: Test Command
    description: A shell command Open Pilot can run from the repository root after
      implementation. Replace the example with the smallest deterministic check for
      this issue.
    placeholder: 'make verify

      '
    render: shell
  validations:
    required: true
- type: textarea
  id: out-of-scope
  attributes:
    label: Out of Scope
    description: Work Open Pilot should not do while implementing this issue.
    value: '- Do not modify unrelated files.

      - Do not change secrets or deployment configuration.

      - Do not merge the resulting PR automatically.

      '
  validations:
    required: false
- type: checkboxes
  id: queue-checklist
  attributes:
    label: Queue Checklist
    description: Review the issue before applying pickup labels or assigning open-pilot.
    options:
    - label: The issue is small enough for one focused PR.
      required: true
    - label: The test command is specific to this issue and can run non-interactively.
      required: true
    - label: The target repository has Open Pilot labels bootstrapped.
      required: true
    - label: I approve Open Pilot pickup of this completed issue.
      required: true
