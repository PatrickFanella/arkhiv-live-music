name: template-check

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

# GitHub Actions deploys main (.github/workflows/deploy.yml); Gitea keeps verification only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          package_json_file: web/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Verify shared-engine consumer
        run: make verify
      - name: Build container images
        run: make compose-build
