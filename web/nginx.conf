server {
 listen 80;
 root /usr/share/nginx/html;
 # HTML revalidates on every load so a deploy shows up immediately;
 # Vite's hashed assets never change and can be cached for a year.
 location / { add_header Cache-Control "no-cache" always; try_files $uri $uri/ =404; }
 location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
 location /api/ { proxy_pass http://api:8080; proxy_read_timeout 30s; }
}
